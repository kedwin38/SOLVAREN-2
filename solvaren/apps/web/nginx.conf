# SOLVAREN console — nginx runtime configuration.
#
# The application shell must never be cached: a stale bundle against a new API is how a
# release ceremony breaks halfway through.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Do not advertise the server version.
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"                     always;
    add_header X-Frame-Options           "DENY"                        always;
    add_header Referrer-Policy           "no-referrer"                 always;
    # `publickey-credentials-get=(self)` is required for the WebAuthn release ceremony.
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The shell is never cached.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed assets are immutable by construction.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Single-page application: every unmatched path renders the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
