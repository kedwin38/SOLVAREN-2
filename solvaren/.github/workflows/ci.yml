#
# SOLVAREN continuous integration.
#
# Gates that matter on a payment platform, ordered to fail fastest:
#
#   1. Secrets — nothing resembling a credential reaches the repository.
#   2. Source invariants — properties that must hold in the code itself.
#   3. Static analysis — types.
#   4. Unit tests — the domain and security kernel, and the Daraja client.
#   5. Database assertions — the immutability guarantees, against real PostgreSQL.
#   6. Build + bundle budget + container images.
#

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history is scanned, not just the tip

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  invariants:
    name: Source invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each check is verified to fail on a broken tree before being trusted to pass.
      - name: Check source invariants
        run: node scripts/check-invariants.mjs

  static:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  database:
    name: Database security assertions
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: node scripts/migrate.mjs

      - name: Attack the schema directly
        run: node scripts/db-test.mjs "$DATABASE_URL"

  build:
    name: Build and bundle budget
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The API must compile to the artefact the container actually runs.
      - name: Build the API
        run: |
          set -euo pipefail
          pnpm --filter @solvaren/core build
          pnpm --filter @solvaren/daraja build
          pnpm --filter @solvaren/storage build
          pnpm --filter @solvaren/api build
          test -f apps/api/dist/server.js

      - name: No test code in the deployable output
        run: |
          set -euo pipefail
          found="$(find apps/api/dist packages/*/dist \
            \( -name '*.test.js' -o -name 'test-harness.js' \) 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "::error::test code was emitted into the production build:"
            echo "$found"
            exit 1
          fi

      - name: Build the console
        run: pnpm --filter @solvaren/web build

      - name: Enforce the bundle budget
        run: |
          set -euo pipefail
          # A payment console is opened on a phone over a mobile network during a
          # payroll run. The budget is enforced rather than aspirational.
          total=$(find apps/web/dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          budget=$((150 * 1024))
          echo "Gzipped JavaScript: $((total / 1024)) KB (budget $((budget / 1024)) KB)"
          if [ "$total" -gt "$budget" ]; then
            echo "::error::bundle is over budget"
            exit 1
          fi

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4

      # The images are what Railway deploys; a Dockerfile that only works on a
      # developer's machine is a broken deploy discovered at the worst time.
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t solvaren-api:ci .

      - name: Build the console image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_BASE_URL=https://api.example.test -t solvaren-web:ci .
